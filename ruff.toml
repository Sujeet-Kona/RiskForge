# Ruff configuration for RiskForge.
#
# Deliberately narrow. The enforced rules are pyflakes plus the pycodestyle
# families that catch broken or dead code: an unused import, an unused local, an
# f-string with no placeholder. Those are defects, not taste.
#
# The broader families ruff can check (import sorting, modernisation,
# simplification, bugbear, implicit string concatenation) report 96 findings
# across this repository today. Clearing them would mean rewriting files that
# this project has no reason to touch, so they are left unenforced rather than
# silently fixed. The breakdown is recorded in docs/ci.md.
target-version = "py312"

# Generated state. Ruff excludes .venv by default; these it would not.
extend-exclude = ["artifacts", "data", "mlruns"]

[lint]
select = ["E4", "E7", "E9", "F"]
